services:
  # ==============================
  # DATABASES
  # ==============================

  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  customer-db:
    image: postgres:16
    container_name: customer-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: customer_db
    ports:
      - "5434:5432"
    volumes:
      - customer_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d customer_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:16
    container_name: order-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: order_db
    ports:
      - "5435:5432"
    volumes:
      - order_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d order_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  product-db:
    image: mongo:7
    container_name: product-db
    ports:
      - "27018:27017"
    volumes:
      - product_data:/data/db

  shipment-db:
    image: mongo:7
    container_name: shipment-db
    ports:
      - "27019:27017"
    volumes:
      - shipment_data:/data/db

  # ==============================
  # REDIS
  # ==============================

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================
  # KAFKA
  # ==============================

  kafka:
    image: apache/kafka:3.8.0
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # ==============================
  # AUTH SERVICE
  # ==============================

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://user:password@auth-db:5432/auth_db?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KAFKA_BROKERS: kafka:29092
    depends_on:
      auth-db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # ==============================
  # CUSTOMER SERVICE
  # ==============================

  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    environment:
      PORT: "3002"
      DATABASE_URL: postgresql://user:password@customer-db:5432/customer_db?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KAFKA_BROKERS: kafka:29092
    depends_on:
      customer-db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # ==============================
  # PRODUCT SERVICE
  # ==============================

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    environment:
      PORT: "3003"
      GRPC_PORT: "50053"
      MONGO_URI: mongodb://product-db:27017/product_db
    depends_on:
      - product-db
    restart: unless-stopped

  # ==============================
  # ORDER SERVICE
  # ==============================

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      PORT: "3004"
      DATABASE_URL: postgresql://user:password@order-db:5432/order_db?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KAFKA_BROKERS: kafka:29092
      CUSTOMER_GRPC_URL: customer-service:50052
      PRODUCT_GRPC_URL: product-service:50053
    depends_on:
      order-db:
        condition: service_healthy
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
    restart: unless-stopped

  # ==============================
  # ORDER OUTBOX PUBLISHER
  # ==============================

  order-outbox-publisher:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    command: [ "node", "src/outbox.publisher.js" ]
    environment:
      DATABASE_URL: postgresql://user:password@order-db:5432/order_db?schema=public
      KAFKA_BROKERS: kafka:29092
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # ==============================
  # SHIPMENT SERVICE
  # ==============================

  shipment-service:
    build:
      context: ./services/shipment-service
      dockerfile: Dockerfile
    environment:
      PORT: "3005"
      MONGODB_URI: mongodb://shipment-db:27017/shipment_db
    depends_on:
      - shipment-db
    restart: unless-stopped

  # ==============================
  # SHIPMENT KAFKA CONSUMER
  # ==============================

  shipment-consumer:
    build:
      context: ./services/shipment-service
      dockerfile: Dockerfile
    command: [ "node", "src/kafka.consumer.js" ]
    environment:
      MONGODB_URI: mongodb://shipment-db:27017/shipment_db
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: order-created
      KAFKA_GROUP_ID: shipment-service-group
    depends_on:
      - shipment-db
      - kafka
    restart: unless-stopped

  # ==============================
  # API GATEWAY
  # ==============================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      AUTH_SERVICE_URL: http://auth-service:3001
      CUSTOMER_SERVICE_URL: http://customer-service:3002
      PRODUCT_SERVICE_URL: http://product-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      SHIPMENT_SERVICE_URL: http://shipment-service:3005
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - customer-service
      - product-service
      - order-service
      - shipment-service
    restart: unless-stopped

# ==============================
# VOLUMES
# ==============================

volumes:
  auth_data:
  customer_data:
  order_data:
  product_data:
  shipment_data:
  redis_data:
